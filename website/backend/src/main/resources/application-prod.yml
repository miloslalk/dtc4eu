# Production profile: no defaults — all configuration must come from the
# environment (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, JWT_ACCESS_TTL,
# JWT_REFRESH_TTL, STORAGE_ENDPOINT, STORAGE_BUCKET, STORAGE_ACCESS_KEY,
# STORAGE_SECRET_KEY, CORS_ALLOWED_ORIGINS).
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    eu.dtc4eu.website: INFO

website:
  security:
    # replaces the published seed webadmin password at start-up while it still works
    force-seed-admin-rotation: true
    seed-admin-password: ${SEED_ADMIN_PASSWORD:}
