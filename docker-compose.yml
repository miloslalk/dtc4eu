services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dtc4eu
      POSTGRES_USER: dtc4eu
      POSTGRES_PASSWORD: dtc4eu
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtc4eu -d dtc4eu"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dtc4eu
      MINIO_ROOT_PASSWORD: dtc4eu123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
