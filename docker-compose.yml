services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dtc4eu
      POSTGRES_USER: dtc4eu
      POSTGRES_PASSWORD: dtc4eu
    # host port 5433: many dev machines already run a native Postgres on 5432
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtc4eu -d dtc4eu"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Public-website CMS database — fully separate from the platform DB
  website-db:
    image: postgres:16
    environment:
      POSTGRES_DB: dtc4eu_website
      POSTGRES_USER: dtc4eu_website
      POSTGRES_PASSWORD: dtc4eu_website
    ports: ["5434:5432"]
    volumes:
      - website_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtc4eu_website -d dtc4eu_website"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372  # community MinIO build (minio/minio left Docker Hub); pinned by digest — bump deliberately
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dtc4eu
      MINIO_ROOT_PASSWORD: dtc4eu123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  website_pgdata:
  miniodata:
